<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio de Evidencias</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary-color: #2c3e50;
            --accent-construye: #2980b9;
            --accent-implementa: #27ae60;
            --text-color: #333333;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--primary-color);
            color: #ffffff;
            text-align: center;
            padding: 2.5rem 1rem;
            box-shadow: var(--shadow);
        }

        header h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        main {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            flex: 1;
        }

        .block {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            border-top: 5px solid;
        }

        .block.construye {
            border-color: var(--accent-construye);
        }

        .block.implementa {
            border-color: var(--accent-implementa);
        }

        .block h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #eeeeee;
        }

        .block.construye h2 {
            color: var(--accent-construye);
        }

        .block.implementa h2 {
            color: var(--accent-implementa);
        }

        .practice-list {
            list-style: none;
        }

        .practice-list li {
            margin-bottom: 0.8rem;
        }

        .practice-list a {
            display: block;
            padding: 0.75rem 1rem;
            background-color: #f8f9fa;
            color: var(--text-color);
            text-decoration: none;
            border-radius: 5px;
            border: 1px solid #e9ecef;
            transition: all 0.2s ease-in-out;
        }

        .practice-list a:hover {
            background-color: var(--primary-color);
            color: #ffffff;
            transform: translateX(5px);
        }

        .placeholder-text {
            color: #7f8c8d;
            font-style: italic;
            padding: 1rem 0;
        }

        footer {
            background-color: var(--primary-color);
            color: #ffffff;
            text-align: center;
            padding: 1.5rem 1rem;
            margin-top: auto;
            font-size: 0.95rem;
        }

        footer strong {
            color: #f1c40f;
        }
    </style>
</head>
<body>

    <header>
        <h1>Portafolio de Evidencias</h1>
        <p>Desarrollo e Implementación de Aplicaciones Web</p>
    </header>

    <main>
        <section class="block construye">
            <h2>Construye Aplicaciones Web</h2>
            <ul class="practice-list">
                <li><a href="practica1.html">Práctica 1</a></li>
                <li><a href="practica2.html">Práctica 2</a></li>
                <li><a href="practica3.html">Práctica 3</a></li>
                <li><a href="practica4.html">Práctica 4</a></li>
                <li><a href="practica5.html">Práctica 5</a></li>
            </ul>
        </section>

        <section class="block implementa">
            <h2>Implementa Aplicaciones Web</h2>
        </section>
    </main>

    <footer>
        <p>Elaborado por: <strong>Zapien Parente Katherine Alondra</strong> | Grupo: <strong>5CPM</strong></p>
    </footer>

</body>
</html>
